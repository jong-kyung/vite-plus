[[case]]
name = "unsupported_pack_options"
vp = ["local", "global"]
steps = [
  { argv = ["vpt", "json-edit", "package.json", "scripts.prepack", "node -e \"require('node:fs').writeFileSync('prepack-ran', 'unexpected')\""], snapshot = false },
  { argv = ["vp", "pm", "pack", "--out", "package.tgz", "--pack-destination", "output"], comment = "Do not prepare an output directory or run prepack when an option is unsupported.", continue-on-failure = true },
  ["vpt", "stat-file", "output", "--assert", "missing"],
  ["vpt", "stat-file", "prepack-ran", "--assert", "missing"],
]

[[case]]
name = "command_pack_npm10"
vp = "global"
serial = true
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "pm", "pack", "--json"], comment = "should pack current package" },
  { argv = ["vpt", "rm", "-f", "command-pack-npm10-1.0.0.tgz"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--pack-destination", "./dist", "--json"], comment = "should pack with destination" },
  { argv = ["vpt", "rm", "-rf", "./dist"], continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--json", "--", "--loglevel=warn"], comment = "should support pass through arguments" },
  { argv = ["vpt", "rm", "-f", "command-pack-npm10-1.0.0.tgz"], snapshot = false, continue-on-failure = true },
]
