[[case]]
name = "npm_install_rejects_dev_only"
vp = ["local", "global"]
env = { npm_config_audit = "false", npm_config_fund = "false" }
steps = [
  { argv = ["vp", "install", "--dev"], comment = "reject dev-only install rather than installing every dependency type", continue-on-failure = true },
  { argv = ["vpt", "stat-file", "package-lock.json", "--assert", "missing"], continue-on-failure = true },
  { argv = ["vpt", "stat-file", "node_modules", "--assert", "missing"], continue-on-failure = true },
  { argv = ["vp", "install", "--dev", "--fix-lockfile", "--silent"], comment = "silent mode still reports all unsupported options", continue-on-failure = true },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "mkdir", "node_modules"], snapshot = false },
  { argv = ["vpt", "write-file", "node_modules/preserved.txt", "keep"], snapshot = false },
  { argv = ["vp", "install", "--dev", "--frozen-lockfile", "--silent"], comment = "reject before npm ci can delete existing node_modules", continue-on-failure = true },
  { argv = ["vpt", "stat-file", "node_modules/preserved.txt", "--assert", "file"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json", "package-lock.json"], continue-on-failure = true },
]

[[case]]
name = "npm_install_dev_with_package_uses_add"
vp = ["local", "global"]
env = { npm_config_audit = "false", npm_config_fund = "false" }
steps = [
  { argv = ["vp", "install", "-D", "./dev-dep", "--ignore-scripts"], comment = "with a package argument, -D still saves to devDependencies" },
  { argv = ["vpt", "print-file", "package.json"] },
  { argv = ["vpt", "stat-file", "node_modules/dev-only-fixture/package.json", "--assert", "file"] },
]
