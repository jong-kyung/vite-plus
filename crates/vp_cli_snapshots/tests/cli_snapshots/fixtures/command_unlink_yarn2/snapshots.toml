[[case]]
name = "unsupported_unlink_recursive"
vp = ["local", "global"]
steps = [
  { argv = ["vpt", "touch-file", "yarn.lock"], snapshot = false },
  { argv = ["vp", "install"], snapshot = false },
  { argv = ["vp", "unlink", "--recursive", "linked-lib"], comment = "Yarn 2 has no native unlink and must not fall through to the project script.", continue-on-failure = true },
  { argv = ["vpt", "stat-file", "unlink-script-ran", "--assert", "missing"], continue-on-failure = true },
  { argv = ["vp", "unlink", "-r"], continue-on-failure = true },
  ["vpt", "stat-file", "unlink-script-ran", "--assert", "missing"],
]
