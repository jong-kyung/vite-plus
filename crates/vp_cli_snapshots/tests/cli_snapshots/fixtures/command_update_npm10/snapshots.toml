[[case]]
name = "unsupported_update_options"
vp = ["local", "global"]
steps = [
  { argv = ["vp", "update", "--latest", "--interactive", "--dev", "--prod", "--no-optional"], comment = "Report every unsupported option without changing dependencies.", continue-on-failure = true },
  ["vpt", "stat-file", "package-lock.json", "--assert", "missing"],
  ["vpt", "stat-file", "node_modules", "--assert", "missing"],
]

[[case]]
name = "command_update_npm10"
vp = "global"
serial = true
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "update", "testnpm2", "--", "--no-audit"], comment = "should update package within semver range" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "up", "testnpm2", "--latest", "--", "--no-audit"], comment = "reject unsupported --latest without updating dependencies", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "update", "-D", "--", "--no-audit"], comment = "reject unsupported dev-only updates", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "update", "-P", "--no-save", "--", "--no-audit"], comment = "reject unsupported production-only updates even with no-save", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "rm", "testnpm2"], comment = "should skip optional dependencies" },
  ["vp", "add", "testnpm2@1.0.0", "-O", "--", "--no-audit"],
  { argv = ["vp", "update", "--no-optional", "--", "--no-audit"], comment = "reject unsupported optional dependency exclusion", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "update", "--", "--no-audit"], comment = "should update all packages but won't change the package.json" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
]
