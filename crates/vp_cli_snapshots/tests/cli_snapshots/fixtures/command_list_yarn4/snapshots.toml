[[case]]
name = "unsupported_list_options"
vp = ["local", "global"]
steps = [
  { argv = ["vp", "pm", "list", "--depth", "0", "--json", "--", "--help"], comment = "Explicit output options must not succeed through Yarn Berry's list Noop.", continue-on-failure = true },
]

[[case]]
name = "managed_global_list_preserves_json"
vp = "global"
steps = [
  { argv = ["vp", "list", "-g", "--json"], comment = "Managed global list output remains independent of the project's Yarn support." },
]

[[case]]
name = "command_list_yarn4"
vp = "global"
steps = [
  { argv = ["vp", "pm", "list"], comment = "should show warning that yarn@2+ does not support list command", continue-on-failure = true },
]
