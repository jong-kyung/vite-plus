[[case]]
name = "remove_selectors_rejected"
vp = ["local", "global"]
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "remove", "--save-dev", "--save-optional", "--save-prod", "--filter", "app", "--recursive", "testnpm2"], comment = "reject all unsupported removal selectors without changing the project", continue-on-failure = true },
  ["vpt", "print-file", "package.json"],
  ["vpt", "stat-file", "node_modules", "--assert", "missing"],
  ["vpt", "stat-file", "yarn.lock", "--assert", "missing"],
]

[[case]]
name = "global_remove_bypasses_local_scope_validation"
vp = ["local", "global"]
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "remove", "--global", "--dry-run", "--recursive", "--filter", "app", "typescript"], comment = "global commands take the managed-global path before local package-manager validation", continue-on-failure = true },
  ["vpt", "print-file", "package.json"],
  ["vpt", "stat-file", "node_modules", "--assert", "missing"],
]
