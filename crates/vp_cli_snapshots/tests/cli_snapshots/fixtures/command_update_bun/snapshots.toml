[[case]]
name = "command_update_bun"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "update", "--help"], comment = "should show help", continue-on-failure = true },
  { argv = ["vp", "update", "testnpm2", "--workspace-root"], comment = "reject unsupported --workspace-root without updating dependencies", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "up", "testnpm2", "--latest"], comment = "should update to absolute latest version" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
]

[[case]]
name = "bun_update_dev_before_1_4"
vp = ["local", "global"]
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "update", "--dev", "--latest"], comment = "reject unsupported --dev before updating any dependency", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vpt", "stat-file", "node_modules", "--assert", "missing"], continue-on-failure = true },
  { argv = ["vpt", "stat-file", "bun.lock", "--assert", "missing"], continue-on-failure = true },
  { argv = ["vp", "update", "--dev", "--prod", "--no-optional", "--workspace-root", "--filter", "web", "--workspace", "--recursive"], comment = "report every unsupported option together", continue-on-failure = true },
]
