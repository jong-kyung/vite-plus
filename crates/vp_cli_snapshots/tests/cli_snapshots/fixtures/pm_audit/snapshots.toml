[[case]]
name = "pm_audit_bun"
# Exceeded 20 seconds on Windows in CI run 35299447671.
skip-platforms = ["windows"]
vp = "global"
serial = true
cwd = "bun"
steps = [
  { argv = ["vp", "install", "--", "--silent"], comment = "should install packages first", continue-on-failure = true },
  { argv = ["vp", "pm", "audit"], comment = "should audit dependencies" },
  { argv = ["vp", "pm", "audit", "--fix"], comment = "bun 1.4 runs bun audit fix" },
]

[[case]]
name = "audit_fix_is_rejected_yarn"
vp = ["local", "global"]
cwd = "bun"
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@1.22.22"], snapshot = false },
  { argv = ["vp", "pm", "audit", "--fix", "--", "--help"], comment = "Yarn Classic rejects the named option instead of reporting a successful Noop.", continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@4.18.0"], snapshot = false },
  { argv = ["vp", "pm", "audit", "--fix", "--json", "--", "--help"], comment = "Current Yarn also rejects fix before invoking native help.", continue-on-failure = true },
  ["vpt", "stat-file", "yarn.lock", "--assert", "missing"],
]

[[case]]
name = "audit_fix_is_rejected_old_bun"
vp = ["local", "global"]
cwd = "bun"
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "bun@1.3.11"], snapshot = false },
  { argv = ["vp", "pm", "audit", "--fix", "--", "--help"], comment = "Bun before 1.4 rejects the named option instead of reporting a successful Noop.", continue-on-failure = true },
  { argv = ["vp", "pm", "audit", "--fix", "--production", "--", "--help"], comment = "Collect fix and production errors together.", continue-on-failure = true },
  ["vpt", "stat-file", "bun.lock", "--assert", "missing"],
]
