[[case]]
name = "unsupported_prune_options"
vp = ["local", "global"]
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "bun@1.3.11"], snapshot = false },
  { argv = ["vp", "pm", "prune"], comment = "Without named options, retain the existing command-level Noop." },
  { argv = ["vp", "pm", "prune", "--prod", "--no-optional", "--", "--help"], comment = "An explicit request must fail instead of reporting a successful Noop.", continue-on-failure = true },
  ["vpt", "stat-file", "node_modules", "--assert", "missing"],
]

[[case]]
name = "command_prune_bun"
vp = "global"
steps = [
  { argv = ["vp", "install", "--", "--silent"], comment = "should install packages first", continue-on-failure = true },
  { argv = ["vp", "pm", "prune"], comment = "should prune extraneous dependencies" },
  { argv = ["vp", "pm", "prune", "--prod"], comment = "should prune dev dependencies" },
  { argv = ["vp", "pm", "prune", "--no-optional"], comment = "should prune optional dependencies using bun --omit=optional" },
]
