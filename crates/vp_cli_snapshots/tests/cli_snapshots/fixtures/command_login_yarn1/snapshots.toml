[[case]]
name = "unsupported_login_selectors"
vp = ["local", "global"]
env = { NODE_OPTIONS = "--no-deprecation" }
steps = [
  { argv = ["vp", "pm", "config", "set", "username", "local-test-user", "--location", "user"], snapshot = false },
  { argv = ["vp", "pm", "config", "set", "email", "local-test@example.invalid", "--location", "user"], snapshot = false },
  { argv = ["vp", "pm", "login", "--registry", "http://127.0.0.1:9", "--scope", "company"], comment = "Classic must reject both selectors rather than ignore them.", continue-on-failure = true },
  { argv = ["vp", "pm", "login"], comment = "Without selectors, retain Classic's existing login behavior." },
]
