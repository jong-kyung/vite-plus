[[case]]
name = "unsupported_publish_git_checks"
vp = ["local", "global"]
steps = [
  { argv = ["vpt", "json-edit", "package.json", "scripts.prepack", "node -e \"require('node:fs').writeFileSync('prepack-ran', 'unexpected')\""], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "bun@1.4.2"], snapshot = false },
  { argv = ["vp", "pm", "publish", "--dry-run", "--no-git-checks"], comment = "Reject before invoking Bun, without requiring authentication.", continue-on-failure = true },
  ["vpt", "stat-file", "prepack-ran", "--assert", "missing"],
]

[[case]]
name = "command_publish_bun"
vp = "global"
steps = [
  { argv = ["vp", "pm", "publish", "--help"], comment = "should show help", continue-on-failure = true },
]
