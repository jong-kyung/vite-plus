[[case]]
name = "unsupported_prune_options"
vp = ["local", "global"]
steps = [
  { argv = ["vp", "pm", "prune", "--prod", "--no-optional", "--", "--help"], comment = "Collect unsupported options before entering Yarn's prune Noop.", continue-on-failure = true },
]

[[case]]
name = "command_prune_yarn4"
vp = "global"
steps = [
  { argv = ["vp", "pm", "prune", "--help"], comment = "should show help", continue-on-failure = true },
  { argv = ["vp", "pm", "prune"], comment = "should show warning that yarn does not support prune command", continue-on-failure = true },
]
