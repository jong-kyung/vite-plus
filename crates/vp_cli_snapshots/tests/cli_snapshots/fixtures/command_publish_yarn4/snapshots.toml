[[case]]
name = "unsupported_publish_git_checks"
vp = ["local", "global"]
steps = [
  { argv = ["vpt", "json-edit", "package.json", "scripts.prepack", "node -e \"require('node:fs').writeFileSync('prepack-ran', 'unexpected')\""], snapshot = false },
  { argv = ["vp", "pm", "publish", "--dry-run", "--no-git-checks"], comment = "Reject the pnpm-only option before the npm fallback.", continue-on-failure = true },
  ["vpt", "stat-file", "prepack-ran", "--assert", "missing"],
]

[[case]]
name = "command_publish_yarn4"
vp = "global"
steps = [
  { argv = ["vp", "pm", "publish", "--help"], comment = "should show help", continue-on-failure = true },
  { argv = ["vp", "pm", "publish", "--dry-run", "--", "--loglevel", "error"], comment = "should preview publish without actually publishing (uses npm publish --dry-run)", continue-on-failure = true },
]
