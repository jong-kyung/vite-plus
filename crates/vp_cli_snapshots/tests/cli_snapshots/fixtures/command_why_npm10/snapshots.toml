[[case]]
name = "unsupported_why_dependency_filters"
vp = ["local", "global"]
steps = [
  { argv = ["vp", "why", "react", "--no-optional", "--exclude-peers", "--json", "--", "--help"], comment = "Reject both filters instead of discarding them before npm explain.", continue-on-failure = true },
  { argv = ["vp", "why", "react", "--no-optional"], continue-on-failure = true },
  { argv = ["vp", "why", "react", "--exclude-peers"], continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "npm@12.0.2"], snapshot = false },
  { argv = ["vp", "why", "react", "--no-optional", "--exclude-peers", "--json", "--", "--help"], comment = "Current npm still does not filter these dependency types in explain.", continue-on-failure = true },
]

[[case]]
name = "unsupported_why_workspace_selectors"
vp = ["local", "global"]
steps = [
  { argv = ["vp", "why", "react", "--recursive", "--workspace-root", "--filter", "app", "--json", "--", "--help"], comment = "Reject selectors instead of silently narrowing the request to the filter.", continue-on-failure = true },
  { argv = ["vp", "why", "react", "-r"], continue-on-failure = true },
  { argv = ["vp", "why", "react", "-w"], continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "npm@12.0.2"], snapshot = false },
  { argv = ["vp", "why", "react", "-r", "-w", "--", "--help"], comment = "Current npm must not silently ignore the same named selectors.", continue-on-failure = true },
]

[[case]]
name = "command_why_npm10"
vp = "global"
serial = true
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "install"], comment = "should install packages first", continue-on-failure = true },
  { argv = ["vp", "why", "testnpm2"], comment = "should show why package is installed (uses npm explain)", continue-on-failure = true },
  { argv = ["vp", "explain", "testnpm2"], comment = "should work with explain alias", continue-on-failure = true },
  { argv = ["vp", "why", "test-vite-plus-package"], comment = "should show why dev package is installed", continue-on-failure = true },
  { argv = ["vp", "why", "testnpm2", "--json"], comment = "should support json output", continue-on-failure = true },
  { argv = ["vp", "why", "testnpm2", "test-vite-plus-package"], comment = "should support multiple packages", continue-on-failure = true },
  { argv = ["vp", "why", "testnpm2", "--long"], comment = "should reject --long because npm does not support it", continue-on-failure = true },
  { argv = ["vp", "why", "testnpm2", "--parseable"], comment = "should reject --parseable because npm does not support it", continue-on-failure = true },
  { argv = ["vp", "why", "testnpm2", "-P"], comment = "should reject --prod because npm does not support it", continue-on-failure = true },
  { argv = ["vp", "why", "testnpm2", "--find-by", "customFinder"], comment = "should reject --find-by because npm does not support it", continue-on-failure = true },
  { argv = ["vp", "why", "testnpm2", "--", "--omit=dev"], comment = "should support pass through arguments", continue-on-failure = true },
]
