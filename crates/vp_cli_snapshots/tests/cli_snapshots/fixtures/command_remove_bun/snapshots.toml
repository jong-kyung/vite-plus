[[case]]
name = "remove_selectors_rejected"
vp = ["local", "global"]
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "remove", "--recursive", "testnpm2"], comment = "reject recursive removal on older Bun before invoking the package manager", continue-on-failure = true },
  { argv = ["vp", "remove", "--save-dev", "--save-optional", "--save-prod", "--filter", "app", "--recursive", "testnpm2"], comment = "reject all unsupported removal selectors without changing the project", continue-on-failure = true },
  ["vpt", "print-file", "package.json"],
  ["vpt", "stat-file", "node_modules", "--assert", "missing"],
  ["vpt", "stat-file", "bun.lock", "--assert", "missing"],
]

[[case]]
name = "command_remove_bun"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "remove", "--help"], comment = "should show help", continue-on-failure = true },
  { argv = ["vp", "remove"], comment = "should error because no packages specified", continue-on-failure = true },
  { argv = ["vp", "remove", "testnpm2", "-D"], comment = "reject unsupported --save-dev even when the package is absent", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "add", "testnpm2"], comment = "should add packages to dependencies" },
  ["vp", "add", "-D", "test-vite-plus-install"],
  ["vp", "add", "-O", "test-vite-plus-package-optional"],
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "remove", "testnpm2", "test-vite-plus-install"], comment = "should remove packages from dependencies" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "remove", "-O", "test-vite-plus-package-optional"], comment = "reject --save-optional without removing the dependency", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
]
