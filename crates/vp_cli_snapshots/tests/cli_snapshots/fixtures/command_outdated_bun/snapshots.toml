[[case]]
name = "command_outdated_bun"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "outdated", "--help"], comment = "should show help", continue-on-failure = true },
  { argv = ["vp", "install"], comment = "should install packages first", continue-on-failure = true },
  { argv = ["vp", "outdated", "testnpm2"], comment = "should show outdated package", continue-on-failure = true },
  { argv = ["vp", "outdated", "-r"], comment = "should support recursive output", continue-on-failure = true },
]

[[case]]
name = "outdated_json_format_is_rejected"
vp = ["local", "global"]
steps = [
  { argv = ["vp", "outdated", "--format", "json", "--", "--help"], comment = "Reject named JSON format before running Bun, even when help is passed through.", continue-on-failure = true },
  { argv = ["vp", "outdated", "--format", "json", "--long"], comment = "Collect value-specific and declarative support errors together.", continue-on-failure = true },
]

[[case]]
name = "managed_global_outdated_json_format"
vp = "global"
steps = [
  { argv = ["vp", "outdated", "-g", "--format", "json"], comment = "Managed global operations bypass project Bun support checks.", continue-on-failure = true },
]

[[case]]
name = "outdated_list_format_is_rejected"
vp = ["local", "global"]
steps = [
  { argv = ["vp", "outdated", "--format", "list", "--", "--help"], comment = "Reject named list format instead of silently using Bun's table output.", continue-on-failure = true },
  { argv = ["vp", "outdated", "--format", "list", "--long"], comment = "Collect value-specific and declarative support errors together.", continue-on-failure = true },
]

[[case]]
name = "managed_global_outdated_list_format"
vp = "global"
steps = [
  { argv = ["vp", "outdated", "-g", "--format", "list"], comment = "Managed global list output bypasses project Bun support checks." },
]
